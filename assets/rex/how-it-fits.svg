<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" width="860" height="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How rex and zurg fit together</title>
  <desc id="d">zurg reads your debrid account, registers with rex and sends it the library with media details. Plex apps browse and play through rex, and on play rex reads the file from zurg.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="270" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- boxes -->
  <g font-size="15" text-anchor="middle">
    <rect x="24" y="100" width="150" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="99" y="131" font-weight="600" fill="#0f172a">Debrid account</text>
    <text x="99" y="152" font-size="12" fill="#64748b">RD, TorBox, AD, Usenet…</text>

    <rect x="254" y="100" width="150" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="329" y="131" font-weight="600" fill="#0f172a">zurg</text>
    <text x="329" y="152" font-size="12" fill="#64748b">:9999 · WebDAV /dav</text>

    <rect x="484" y="100" width="150" height="70" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="559" y="131" font-weight="600" fill="#0f172a">rex</text>
    <text x="559" y="152" font-size="12" fill="#64748b">:32400 · no files</text>

    <rect x="716" y="100" width="120" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="776" y="131" font-weight="600" fill="#0f172a">Plex apps</text>
    <text x="776" y="152" font-size="12" fill="#64748b">TV, phone, web</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke-width="2">
    <line x1="176" y1="135" x2="250" y2="135" stroke="#475569" marker-end="url(#a)"/>
    <path d="M404 118 L480 118" stroke="#475569" marker-end="url(#a)"/>
    <path d="M559 172 C559 230 329 230 329 174" stroke="#ea580c" marker-end="url(#o)"/>
    <line x1="712" y1="135" x2="638" y2="135" stroke="#475569" marker-end="url(#a)" marker-start="url(#a)"/>
  </g>

  <!-- labels -->
  <g font-size="12.5" fill="#334155" text-anchor="middle">
    <text x="213" y="124">files</text>
    <text x="442" y="54">1. registers itself</text>
    <text x="442" y="72">2. sends the library</text>
    <text x="442" y="88" font-size="11.5" fill="#64748b">with media details</text>
    <text x="444" y="252" fill="#c2410c">3. on play, rex reads the file from zurg, nothing is downloaded first</text>
    <text x="676" y="106">browse</text>
    <text x="676" y="122">and play</text>
  </g>
</svg>
