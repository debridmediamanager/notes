name: Publish the site in every language
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Retype
        run: npm install --global --silent retypeapp@latest

      - name: Translator self-test
        run: python3 i18n/test_translate.py

      # Translates the English sections that changed and builds English plus every language into .retype.
      # Text that cannot be translated stays English for now (exit 3, a warning); if OpenRouter itself fails
      # (exit 4) the cached site still ships and the run fails.
      - name: Translate and build
        id: build
        env:
          OPENROUTER_TRANSLATE_KEY: ${{ secrets.OPENROUTER_TRANSLATE_KEY }}
        run: |
          set +e
          bash i18n/build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 0 ] || [ "$code" -ge 3 ]

      - name: Keep the translations
        run: |
          git add i18n/cache
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore: translations for ${GITHUB_SHA::8}"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1

      # Cloudflare Pages serves the retype branch.
      - name: Publish to the retype branch
        id: publish
        run: |
          git fetch -q origin retype
          git worktree add -q /tmp/site origin/retype
          rsync -a --delete --exclude .git .retype/ /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish ${GITHUB_SHA::8}"
          git push -q origin HEAD:retype
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Cloudflare builds the retype branch after this push, and the zone cache keeps serving the old pages
      # (a HIT even with max-age=0) until it is purged. Wait for this exact commit to be live, then purge.
      - name: Purge the edge cache once Cloudflare has deployed
        if: steps.publish.outputs.sha != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ZONE: ${{ vars.CLOUDFLARE_ZONE_ID }}
          SHA: ${{ steps.publish.outputs.sha }}
        run: |
          api=https://api.cloudflare.com/client/v4 auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          for i in $(seq 60); do
            state=$(curl -fsS "$api/accounts/$ACCOUNT/pages/projects/notes/deployments?per_page=10" -H "$auth" |
              jq -r --arg s "$SHA" 'first(.result[] | select(.deployment_trigger.metadata.commit_hash == $s)
                | .latest_stage.name + ":" + .latest_stage.status) // "waiting"') || state=unreachable
            echo "$state"
            case $state in
              deploy:success) break ;;
              *:failure|*:canceled) echo "::error::Cloudflare Pages deploy of $SHA: $state"; exit 1 ;;
            esac
            sleep 20
          done
          [ "$state" = deploy:success ] || { echo "::error::Cloudflare Pages did not deploy $SHA in 20 minutes"; exit 1; }
          curl -fsS -X POST "$api/zones/$ZONE/purge_cache" -H "$auth" -H "Content-Type: application/json" \
            --data '{"hosts":["notes.debridmediamanager.com"]}' | jq -e .success

      - name: Report text left in English
        if: steps.build.outputs.code == '3' || steps.build.outputs.code == '4'
        run: |
          if [ "${{ steps.build.outputs.code }}" = 4 ]; then
            echo "::error::OpenRouter failed (key, monthly limit or outage). The site shipped with cached translations only."
            exit 1
          fi
          echo "::warning::Some sections could not be translated and were published in English. They are tried again on the next push."

      - name: Tell #platform-alerts
        if: always()
        env:
          PLATFORM_ALERTS_WEBHOOK: ${{ secrets.PLATFORM_ALERTS_WEBHOOK }}
        run: bash i18n/alert.sh notes "${{ steps.build.outputs.code }}" "${{ job.status }}" "$RUNNER_TEMP/build.log"
