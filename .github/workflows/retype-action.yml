name: Publish the site in every language
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Retype
        run: npm install --global --silent retypeapp@latest

      - name: Translator self-test
        run: python3 i18n/test_translate.py

      # Translates the English sections that changed and builds English plus every language into .retype.
      # Text that cannot be translated stays English for now (exit 3, a warning); if OpenRouter itself fails
      # (exit 4) the cached site still ships and the run fails.
      - name: Translate and build
        id: build
        env:
          OPENROUTER_TRANSLATE_KEY: ${{ secrets.OPENROUTER_TRANSLATE_KEY }}
        run: |
          bash i18n/build.sh || code=$?
          echo "code=${code:-0}" >> "$GITHUB_OUTPUT"
          [ "${code:-0}" -eq 0 ] || [ "${code:-0}" -ge 3 ]

      - name: Keep the translations
        run: |
          git add i18n/cache
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore: translations for ${GITHUB_SHA::8}"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1

      # Cloudflare Pages serves the retype branch.
      - name: Publish to the retype branch
        run: |
          git fetch -q origin retype
          git worktree add -q /tmp/site origin/retype
          rsync -a --delete --exclude .git .retype/ /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish ${GITHUB_SHA::8}"
          git push -q origin HEAD:retype

      - name: Report text left in English
        if: steps.build.outputs.code == '3' || steps.build.outputs.code == '4'
        run: |
          if [ "${{ steps.build.outputs.code }}" = 4 ]; then
            echo "::error::OpenRouter failed (key, monthly limit or outage). The site shipped with cached translations only."
            exit 1
          fi
          echo "::warning::Some sections could not be translated and were published in English. They are tried again on the next push."
