<style>
  /* debridmediamanager.com's font, shared by every DMM site. Code stays monospace. */
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
  }
  .font-body { font-family: var(--font-sans); }
  /* Retype sets inline code inline-flex, so a long path or URL cannot wrap and widens the page on a phone. */
  p > code, li > code, h1 > code, h2 > code, h3 > code, h4 > code { overflow-wrap: anywhere; }
  @media (max-width: 767px) {
    /* The "notes" label pushes the header past a phone's width. */
    #retype-branding-label { display: none; }
    /* Four tabs (Linux, macOS, Windows, Docker) overrun the tab bar at phone width. */
    .retype-markdown .pluggable a.px-5 { padding-left: 0.75rem; padding-right: 0.75rem; }
  }
</style>
