<style>
  /* debridmediamanager.com's font, shared by every DMM site. Code stays monospace. */
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
  }
  .font-body { font-family: var(--font-sans); }
  /* Retype sets inline code inline-flex, so a long path or URL cannot wrap and widens the page on a phone. */
  p > code, li > code, h1 > code, h2 > code, h3 > code, h4 > code { overflow-wrap: anywhere; }
  @media (max-width: 767px) {
    /* The "notes" label pushes the header past a phone's width. */
    #retype-branding-label { display: none; }
    /* Four tabs (Linux, macOS, Windows, Docker) overrun the tab bar at phone width. */
    .retype-markdown .pluggable a.px-5 { padding-left: 0.75rem; padding-right: 0.75rem; }
  }
</style>
<style>
  /* Arabic pages: the text reads right to left, code and commands stay left to right. */
  html[lang="ar"] .retype-markdown { direction: rtl; }
  html[lang="ar"] .retype-markdown pre, html[lang="ar"] .retype-markdown code { direction: ltr; unicode-bidi: isolate; }
</style>
<script>
  // Every language is its own Retype build under /<lang>/. The language menu links end in #lang: keep the
  // reader on the same page in the other language instead of sending them to its home page.
  (function () {
    var langs = /^\/(zh|es|ar|id|pt|fr|ja|ru|de)(?=\/|$)/;
    var m = location.pathname.match(langs);
    if (m) document.documentElement.lang = m[1]; // Retype has no Indonesian locale and labels /id/ as English
    document.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest('a[href$="#lang"]');
      if (!a) return;
      e.preventDefault();
      e.stopPropagation();
      var to = new URL(a.href).pathname.replace(/\/$/, "");
      location.href = to + (location.pathname.replace(langs, "") || "/") + location.search;
    }, true);
  })();
</script>
